[project]
name = "travel-hacking-monitor"
version = "0.1.0"
description = "On-demand award-availability checker for the Travel Hacking Toolkit. You (or Kiro) run it when you want an answer: it searches seats.aero, computes CPM against your reference data, and prints ranked opportunities. No background daemon, no alerts."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
th-monitor = "th_monitor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
